name: PrivateAgent
options:
  bundleIdPrefix: com.privateagent
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic

packages:
  PrivateAgent:
    path: .

targets:
  PrivateAgentApp:
    type: application
    platform: iOS
    sources:
      - path: Apps/PrivateAgentiOS
      - path: Vendor/flash-moe/shaders.metal
        type: file
        buildPhase: sources
    dependencies:
      - package: PrivateAgent
        product: PrivateAgentUI
      - package: PrivateAgent
        product: FlashMoEBridge
      - package: PrivateAgent
        product: ModelHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privateagent.ios
        PRODUCT_NAME: PrivateAgent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Str8ZeRO"
        INFOPLIST_KEY_CFBundleName: "Str8ZeRO"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: Apps/PrivateAgentiOS/Info.plist
