# PrivateAgent iOS compile + TestFlight release.
#
# Triggers
#   push / pull_request  → simulator-build only (no secrets)
#   push tag vMAJOR.MINOR.PATCH → simulator-build, then testflight-release
#   workflow_dispatch    → same release path for an existing tag (not a branch)
#
# Versioning
#   MARKETING_VERSION = tag without the leading v (v1.2.3 → 1.2.3)
#   BUILD_NUMBER      = MAJOR*1000000 + MINOR*1000 + PATCH  (v1.2.3 → 1002003)
#   The same tag always produces the same CFBundleVersion. To ship a new binary,
#   push a new tag. Manual dispatch re-runs that same encoded number.
#
# Pins
#   Runner: macos-15
#   Xcode:  26.3  (not latest-stable)
name: iOS TestFlight

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to re-release (vMAJOR.MINOR.PATCH). The selected branch only supplies this workflow file; the app is built from the tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('release-{0}', inputs.tag) || (startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref_name) || format('ci-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  IOS_BUNDLE_ID_DEFAULT: com.privateagent.ios
  XCODE_VERSION: "26.3"

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      tag: ${{ steps.version.outputs.tag }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Derive marketing version and build number
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: bash Scripts/resolve-ios-release-version.sh --ci

      - name: Confirm dispatch tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::group::Verify refs/tags/${TAG}"
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist on origin. Create it with: git tag ${TAG} && git push origin ${TAG}"
            exit 1
          fi
          echo "::endgroup::"

  simulator-build:
    name: Unsigned iOS simulator build
    needs: resolve-version
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print toolchain versions
        run: |
          set -euo pipefail
          echo "::group::xcodebuild -version"
          xcodebuild -version
          echo "::endgroup::"
          echo "::group::swift --version"
          swift --version
          echo "::endgroup::"
          echo "::group::Cross-platform Swift preflight"
          python3 Scripts/check-cross-platform-swift.py
          echo "::endgroup::"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: bash Scripts/generate-xcode-project.sh

      - name: Build for iOS Simulator (unsigned)
        env:
          MARKETING_VERSION: ${{ needs.resolve-version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
        run: |
          set -euo pipefail
          echo "::group::xcodebuild (iOS Simulator, unsigned)"
          xcodebuild \
            -project PrivateAgent.xcodeproj \
            -scheme PrivateAgentApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            build | tee ios-simulator-build.log
          echo "::endgroup::"

      - name: Upload simulator logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-simulator-failure-logs
          path: ios-simulator-build.log
          if-no-files-found: ignore

  testflight-release:
    name: Sign and upload to TestFlight
    needs: [resolve-version, simulator-build]
    if: needs.resolve-version.outputs.is_release == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MARKETING_VERSION: ${{ needs.resolve-version.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
      RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve bundle id
        run: |
          set -euo pipefail
          bundle_id="${IOS_BUNDLE_ID_VAR:-$IOS_BUNDLE_ID_DEFAULT}"
          echo "IOS_BUNDLE_ID=${bundle_id}" >> "$GITHUB_ENV"
          echo "Using bundle id ${bundle_id} for ${RELEASE_TAG} (${MARKETING_VERSION} / ${BUILD_NUMBER})"
        env:
          IOS_BUNDLE_ID_VAR: ${{ vars.IOS_BUNDLE_ID }}

      - name: Preflight TestFlight secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash Scripts/require-testflight-secrets.sh

      - name: Install XcodeGen and fastlane
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          gem install fastlane --no-document
          xcodegen --version
          fastlane --version

      - name: Import distribution certificate and profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash Scripts/import-ios-distribution-signing.sh

      - name: Generate signed Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ruby Scripts/patch-project-yml-for-distribution.rb
          bash Scripts/generate-xcode-project.sh

      - name: Archive App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "::group::App target signing settings"
          xcodebuild -showBuildSettings \
            -project PrivateAgent.xcodeproj \
            -target PrivateAgentApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            | awk '/PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|MARKETING_VERSION|CURRENT_PROJECT_VERSION/ { print }'
          echo "::endgroup::"

          echo "::group::xcodebuild archive"
          # Do not pass PROVISIONING_PROFILE_SPECIFIER / CODE_SIGN_* /
          # DEVELOPMENT_TEAM / PRODUCT_BUNDLE_IDENTIFIER here. Those overrides
          # apply to every target, including SwiftPM packages that cannot use
          # an App Store profile. Signing lives on PrivateAgentApp only.
          xcodebuild archive \
            -project PrivateAgent.xcodeproj \
            -scheme PrivateAgentApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PrivateAgent.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            | tee ios-archive.log
          echo "::endgroup::"

          python3 Scripts/write-export-options.py

          echo "::group::xcodebuild -exportArchive"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PrivateAgent.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee ios-export.log
          echo "::endgroup::"

          ipa="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            echo "::error::xcodebuild -exportArchive did not produce an IPA. Check the signing profile and Apple Distribution identity."
            exit 1
          fi
          echo "IPA_PATH=${ipa}" >> "$GITHUB_ENV"
          mkdir -p out
          cp "$ipa" "out/PrivateAgent-${RELEASE_TAG}.ipa"
          echo "Exported ${ipa} as out/PrivateAgent-${RELEASE_TAG}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: PrivateAgent-${{ needs.resolve-version.outputs.tag }}-ipa
          path: out/PrivateAgent-${{ needs.resolve-version.outputs.tag }}.ipa

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key_path"
          if [[ ! -s "$key_path" ]]; then
            echo "::error::ASC_KEY_P8_BASE64 did not decode to a non-empty .p8. Re-encode AuthKey_XXXX.p8 as documented in Docs/TESTFLIGHT_SETUP.md."
            exit 1
          fi
          echo "ASC_KEY_PATH=${key_path}" >> "$GITHUB_ENV"

      - name: Preflight IPA (icons, plist, architectures)
        run: bash Scripts/preflight-ipa.sh

      - name: Validate IPA with altool
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
        run: |
          set -euo pipefail
          echo "::group::fastlane ios validate_ipa"
          fastlane ios validate_ipa | tee ios-altool-validate.log
          echo "::endgroup::"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
          TESTFLIGHT_CHANGELOG: "${{ needs.resolve-version.outputs.tag }} (${{ github.sha }})"
        run: |
          set -euo pipefail
          echo "::group::fastlane ios upload_testflight"
          fastlane ios upload_testflight | tee ios-testflight-upload.log
          echo "::endgroup::"

      - name: Upload TestFlight logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-testflight-failure-logs
          path: |
            ios-archive.log
            ios-export.log
            ios-altool-validate.log
            ios-testflight-upload.log
          if-no-files-found: ignore

      - name: Cleanup signing material
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/dist.p12" \
                "$RUNNER_TEMP/appstore.mobileprovision" \
                "$RUNNER_TEMP/profile.plist" \
                "$RUNNER_TEMP/AuthKey.p8" \
                "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID:-}.p8"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
