name: iOS TestFlight

on:
  push:
    tags:
      - "*"        # TestFlight runs only on tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_BUNDLE_ID_DEFAULT: com.privateagent.ios
  MARKETING_VERSION: "0.1.0"

jobs:
  simulator:
    name: Unsigned iOS simulator build
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version | tee xcode-version.log
          swift --version | tee swift-version.log
          python3 Scripts/check-cross-platform-swift.py | tee cross-platform-preflight.log

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          if ! xcodegen generate; then
            echo "::error::xcodegen failed to parse project.yml. A Plist/info block needs an explicit path, and every source path must exist."
            exit 1
          fi
          test -d PrivateAgent.xcodeproj
          xcodebuild -list -project PrivateAgent.xcodeproj | tee xcode-list.log

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project PrivateAgent.xcodeproj \
            -scheme PrivateAgentApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${{ env.MARKETING_VERSION }}" \
            build | tee ios-simulator-build.log

      - name: Upload simulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-failure-logs
          path: |
            xcode-version.log
            swift-version.log
            cross-platform-preflight.log
            xcode-list.log
            ios-simulator-build.log
          if-no-files-found: ignore

  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    needs: simulator
    if: startsWith(github.ref, 'refs/tags/')   # Only run on tags

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve bundle id
        run: echo "IOS_BUNDLE_ID=${IOS_BUNDLE_ID:-$IOS_BUNDLE_ID_DEFAULT}" >> "$GITHUB_ENV"
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}

      - name: Require TestFlight secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash Scripts/require-testflight-secrets.sh

      - name: Install XcodeGen and fastlane
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          gem install fastlane --no-document

      - name: Import distribution certificate and profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"

          KCP="$RUNNER_TEMP/testflight.keychain-db"
          KCPW="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KCP" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KCPW" >> "$GITHUB_ENV"

          security create-keychain -p "$KCPW" "$KCP"
          security set-keychain-settings -lut 21600 "$KCP"
          security unlock-keychain -p "$KCPW" "$KCP"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KCP" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KCP"
          security list-keychains -d user -s "$KCP"
          security find-identity -v -p codesigning "$KCP"

          if ! security find-identity -v -p codesigning "$KCP" | grep -q "Apple Distribution"; then
            echo "::error::The imported .p12 does not contain an Apple Distribution identity."
            exit 1
          fi

          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          UUID="$($PB -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$($PB -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          TEAM="$($PB -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          APPID="$($PB -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          PROFILE_BUNDLE="${APPID#*.}"

          if [[ "$TEAM" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::APPLE_TEAM_ID ($APPLE_TEAM_ID) does not match the provisioning profile team ($TEAM)."
            exit 1
          fi
          if [[ "$PROFILE_BUNDLE" != "$IOS_BUNDLE_ID" ]]; then
            echo "::error::Bundle id $IOS_BUNDLE_ID does not match the provisioning profile ($PROFILE_BUNDLE)."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Generate signed Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            d = YAML.load_file("project.yml")
            t = d.fetch("targets").fetch("PrivateAgentApp")
            t["settings"] ||= {}
            t["settings"]["base"] ||= {}
            t["settings"]["base"].merge!({
              "CODE_SIGN_STYLE" => "Manual",
              "CODE_SIGN_IDENTITY" => "Apple Distribution",
              "DEVELOPMENT_TEAM" => ENV.fetch("APPLE_TEAM_ID"),
              "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("PROFILE_NAME"),
              "PRODUCT_BUNDLE_IDENTIFIER" => ENV.fetch("IOS_BUNDLE_ID"),
              "CURRENT_PROJECT_VERSION" => ENV.fetch("GITHUB_RUN_NUMBER"),
              "MARKETING_VERSION" => ENV.fetch("MARKETING_VERSION")
            })
            File.write("project.yml", d.to_yaml)
          '
          xcodegen generate

      - name: Archive App Store IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project PrivateAgent.xcodeproj \
            -scheme PrivateAgentApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PrivateAgent.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${{ env.MARKETING_VERSION }}" \
            | tee ios-archive.log

          python3 - <<'PY'
          import os, plistlib
          p = {
              "method": "app-store-connect",
              "destination": "export",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "uploadSymbols": True,
              "compileBitcode": False,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as fh:
              plistlib.dump(p, fh)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PrivateAgent.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee ios-export.log

          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [[ -z "$IPA" ]]; then
            echo "::error::xcodebuild -exportArchive did not produce an IPA."
            exit 1
          fi

          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          mkdir -p out
          cp "$IPA" out/PrivateAgent-testflight.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAgent-testflight-ipa
          path: out/PrivateAgent-testflight.ipa

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
          TESTFLIGHT_CHANGELOG: "GitHub Actions ${{ github.run_number }} (${{ github.sha }})"
        run: |
          set -euo pipefail
          fastlane ios upload_testflight | tee ios-testflight-upload.log

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload TestFlight logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-failure-logs
          path: |
            ios-archive.log
            ios-export.log
            ios-testflight-upload.log
          if-no-files-found: ignore
